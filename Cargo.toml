[workspace]
members = [
    "crates/atlas-core",
    "crates/atlas-cli",
    "crates/atlas-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Bunlong Prak (Nate) <prakbunlong53@gmail.com>"]
repository = "https://github.com/Bunlong-Prak/Philosophical-argument-atlas"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
